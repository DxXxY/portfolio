<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Объява — доска объявлений (Telegram Mini App, демо)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="store.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --text: var(--tg-theme-text-color, #111418);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #e5484d; --ok: #30a46c; --warn: #f5a524;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) { --bg: #17212b; --bg2: #0e1621; --text: #f5f5f5; --hint: #7d8b99; --link: #6ab3f3; --btn: #5288c1; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: 76px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid transparent;
    border-radius: 10px; padding: 11px 12px; width: 100%; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--btn); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px 8px; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .top { display: flex; align-items: center; gap: 8px; }
  .logo { font-weight: 800; font-size: 19px; letter-spacing: -.3px; }
  .logo b { color: var(--btn); }
  .live { margin-left: auto; font-size: 12px; color: var(--hint); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(48,164,108,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(48,164,108,0); } 100% { box-shadow: 0 0 0 0 rgba(48,164,108,0); } }
  .search { margin-top: 8px; position: relative; }
  .search input { padding-left: 36px; }
  .search span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--hint); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 7px 12px; border-radius: 20px; background: var(--bg2); font-size: 14px; }
  .chip.on { background: var(--btn); color: var(--btn-text); }

  main { padding: 10px 10px 0; }
  .grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
  .card { background: var(--bg); border-radius: var(--r); overflow: hidden; position: relative; text-align: left; display: flex; flex-direction: column; }
  .card.fresh { animation: fresh 1.6s ease; }
  @keyframes fresh { 0% { transform: scale(.94); box-shadow: 0 0 0 3px var(--btn); } 100% { transform: none; box-shadow: none; } }
  .ph { aspect-ratio: 4/3; display: grid; place-items: center; font-size: 40px; position: relative; }
  .fav { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.28);
    color: #fff; display: grid; place-items: center; font-size: 16px; }
  .fav.on { color: #ff4d6d; background: rgba(255,255,255,.9); }
  .src { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 2px 7px; border-radius: 8px; background: rgba(0,0,0,.45); color: #fff; }
  .info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
  .price { font-weight: 700; font-size: 16px; }
  .ttl { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 12px; color: var(--hint); }
  .empty { text-align: center; color: var(--hint); padding: 50px 20px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); display: flex;
    box-shadow: 0 -1px 0 rgba(0,0,0,.07); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; padding: 8px 0 10px; font-size: 11px; color: var(--hint); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button i { font-style: normal; font-size: 20px; }
  nav button.on { color: var(--btn); }
  nav .add i { background: var(--btn); color: var(--btn-text); width: 40px; height: 30px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; }

  .sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg2); overflow-y: auto; transform: translateX(100%); transition: transform .25s ease; }
  .sheet.open { transform: none; }
  .sheet .hero { aspect-ratio: 4/3; display: grid; place-items: center; font-size: 80px; }
  .sec { background: var(--bg); margin: 8px 0; padding: 14px; }
  .sec h1 { font-size: 20px; margin: 4px 0 8px; }
  .sec .big { font-size: 24px; font-weight: 800; }
  .row { display: flex; gap: 8px; align-items: center; }
  .ava { width: 42px; height: 42px; border-radius: 50%; background: var(--btn); color: var(--btn-text); display: grid; place-items: center; font-weight: 700; }
  .btn { background: var(--btn); color: var(--btn-text); border-radius: 12px; padding: 13px; width: 100%; font-weight: 600; text-align: center; }
  .btn.sec2 { background: var(--bg2); color: var(--link); }
  .back { position: fixed; top: 10px; left: 10px; z-index: 11; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; font-size: 20px; }
  .tg-in .back { display: none; }

  form .f { margin-bottom: 12px; }
  form label { display: block; font-size: 13px; color: var(--hint); margin: 0 2px 5px; }
  .photo-pick { border: 2px dashed var(--hint); border-radius: 12px; aspect-ratio: 16/9; display: grid; place-items: center; color: var(--hint);
    background-size: cover; background-position: center; cursor: pointer; }
  .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .list .item { background: var(--bg); border-radius: var(--r); padding: 10px; display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
  .list .th { width: 64px; height: 64px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 26px; }
  .list .b { flex: 1; min-width: 0; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 600; display: inline-block; }
  .badge.moderation { background: #fff3d6; color: #a86b00; } .badge.active { background: #dcf5e7; color: #1b7a49; }
  .badge.rejected { background: #fde2e3; color: #b42318; }
  .act { display: flex; gap: 6px; margin-top: 6px; }
  .act button { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--bg2); }
  .act .y { background: var(--ok); color: #fff; } .act .n { background: var(--danger); color: #fff; }
  .note { font-size: 13px; color: var(--hint); padding: 4px 4px 12px; }

  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -150%); z-index: 20; background: rgba(20,20,20,.92); color: #fff;
    padding: 10px 14px; border-radius: 12px; font-size: 14px; transition: transform .3s ease; max-width: 92vw; }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Объ<b>ява</b></div>
    <div class="live"><span class="dot"></span><span id="liveTxt">онлайн · синхронизация с сайтом</span></div>
  </div>
  <div id="hdrExtra">
    <div class="search"><span>🔍</span><input id="q" placeholder="Поиск по объявлениям" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="feed" class="on"><i>🏠</i>Лента</button>
  <button data-tab="fav"><i>❤️</i>Избранное</button>
  <button data-tab="new" class="add"><i>＋</i>Подать</button>
  <button data-tab="my"><i>📋</i>Мои</button>
  <button data-tab="admin"><i>🛡️</i>Модерация</button>
</nav>

<div class="sheet" id="sheet"><button class="back" id="backBtn">‹</button><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const inTG = !!(tg && tg.initData);
if (inTG) { document.documentElement.classList.add('tg'); document.body.classList.add('tg-in'); tg.ready(); tg.expand(); }
const tgUser = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user;
const ME = tgUser ? (tgUser.first_name || 'Вы') : 'Вы';
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tab = 'feed', cat = 'all', q = '', freshId = null, sheetOpen = false, newPhoto = '';

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }

function chips() {
  $('#chips').innerHTML = Store.CATS.map(c => `<button class="chip ${c.id === cat ? 'on' : ''}" data-cat="${c.id}">${c.icon} ${c.name}</button>`).join('');
}
function card(a) {
  return `<div class="card ${a.id === freshId ? 'fresh' : ''}" data-open="${a.id}">
    <div class="ph" style="background:${Store.cover(a)}">${a.photo ? '' : Store.icon(a.cat)}
      <button class="fav ${Store.isFav(a.id) ? 'on' : ''}" data-fav="${a.id}">${Store.isFav(a.id) ? '♥' : '♡'}</button>
      <span class="src">${a.source === 'tg' ? '✈️ из Telegram' : '🌐 с сайта'}</span></div>
    <div class="info"><div class="price">${esc(Store.price(a))}</div><div class="ttl">${esc(a.title)}</div>
      <div class="meta">${esc(a.city)} · ${Store.ago(a.createdAt)}</div></div></div>`;
}
function feed(list, emptyText) {
  return list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${emptyText}</div>`;
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#hdrExtra').style.display = tab === 'feed' ? '' : 'none';
  const v = $('#view');
  const active = Store.all().filter(a => a.status === 'active');
  if (tab === 'feed') {
    chips();
    const ql = q.trim().toLowerCase();
    const list = active.filter(a => (cat === 'all' || a.cat === cat) && (!ql || (a.title + ' ' + a.desc + ' ' + a.city).toLowerCase().includes(ql)));
    v.innerHTML = feed(list, 'Ничего не нашлось 🤷<br>Попробуйте другой запрос');
  } else if (tab === 'fav') {
    v.innerHTML = `<div class="note">Избранное</div>` + feed(active.filter(a => Store.isFav(a.id)), 'Нажмите ♡ на объявлении, чтобы сохранить его здесь');
  } else if (tab === 'my') {
    const mine = Store.all().filter(a => a.mine);
    v.innerHTML = `<div class="note">Мои объявления. После модерации они сразу появляются в ленте Mini App и на сайте.</div>
      <div class="list">${mine.length ? mine.map(a => item(a, false)).join('') : '<div class="empty">Вы ещё ничего не подавали.<br>Нажмите «＋ Подать».</div>'}</div>`;
  } else if (tab === 'admin') {
    const all = Store.all();
    const mod = all.filter(a => a.status === 'moderation');
    v.innerHTML = `<div class="note">Панель администратора (в боевой версии видна только админам по Telegram ID).
      На модерации: <b>${mod.length}</b> · Активных: <b>${all.filter(a => a.status === 'active').length}</b></div>
      <div class="list">${mod.length ? mod.map(a => item(a, true)).join('') : '<div class="empty">Очередь модерации пуста ✅<br>Подайте объявление — оно появится здесь.</div>'}</div>
      <div class="note" style="margin-top:6px">Все объявления</div>
      <div class="list">${all.filter(a => a.status !== 'moderation').map(a => item(a, true)).join('')}</div>
      <button class="btn sec2" id="resetBtn" style="margin:6px 0 16px">Сбросить демо-данные</button>`;
  } else if (tab === 'new') {
    v.innerHTML = form();
    bindForm();
  }
  syncMainButton();
}
function item(a, admin) {
  const st = { moderation: 'на модерации', active: 'опубликовано', rejected: 'отклонено' }[a.status];
  return `<div class="item"><div class="th" style="background:${Store.cover(a)}">${a.photo ? '' : Store.icon(a.cat)}</div>
    <div class="b"><div class="ttl" style="font-weight:600">${esc(a.title)}</div>
      <div class="meta">${esc(Store.price(a))} · ${esc(a.city)} · ${a.source === 'tg' ? '✈️ TG' : '🌐 сайт'} · 👁 ${a.views}</div>
      <span class="badge ${a.status}">${st}</span>
      ${admin ? `<div class="act">${a.status !== 'active' ? `<button class="y" data-ok="${a.id}">Одобрить</button>` : ''}
        ${a.status !== 'rejected' ? `<button class="n" data-no="${a.id}">Отклонить</button>` : ''}
        <button data-del="${a.id}">Удалить</button></div>` : `<div class="act"><button data-del="${a.id}">Снять</button></div>`}
    </div></div>`;
}
function form() {
  return `<form id="f" class="sec" style="margin:0 -10px;border-radius:0">
    <h1>Новое объявление</h1>
    <div class="f"><div class="photo-pick" id="pick" style="${newPhoto ? `background-image:url('${newPhoto}');border-style:solid` : ''}">${newPhoto ? '' : '📷 Добавить фото'}</div>
      <input type="file" id="file" accept="image/*" hidden></div>
    <div class="f"><label>Категория</label><select name="cat">${Store.CATS.filter(c => c.id !== 'all').map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select></div>
    <div class="f"><label>Название</label><input name="title" maxlength="70" placeholder="Например: велосипед Stels, 26 дюймов" required></div>
    <div class="two"><div class="f"><label>Цена, ₽</label><input name="price" type="number" inputmode="numeric" min="0" placeholder="0" required></div>
      <div class="f"><label>Город</label><input name="city" value="Новороссийск" required></div></div>
    <div class="f"><label>Описание</label><textarea name="desc" rows="4" maxlength="800" placeholder="Состояние, комплектация, где забрать"></textarea></div>
    <div class="f"><label>Контакт</label><input name="author" value="${esc(ME)}${tgUser && tgUser.username ? ' (@' + esc(tgUser.username) + ')' : ''}"></div>
    ${inTG ? '<div class="note">Нажмите кнопку «Опубликовать» внизу экрана</div>' : '<button class="btn" type="submit">Опубликовать</button>'}
    <div class="note">Объявление уйдёт на модерацию, после одобрения появится в ленте и на основном сайте в реальном времени.</div>
  </form>`;
}
function bindForm() {
  $('#pick').onclick = () => $('#file').click();
  $('#file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.onload = () => { // ужимаем, чтобы влезло в демо-хранилище
      const c = document.createElement('canvas'), k = Math.min(1, 640 / Math.max(img.width, img.height));
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      newPhoto = c.toDataURL('image/jpeg', .72); const p = $('#pick'); p.style.backgroundImage = `url('${newPhoto}')`; p.style.borderStyle = 'solid'; p.textContent = '';
    }; img.src = rd.result; }; rd.readAsDataURL(f);
  };
  $('#f').onsubmit = e => { e.preventDefault(); submit(); };
}
function submit() {
  const f = $('#f'); if (!f) return;
  if (!f.reportValidity()) { haptic('heavy'); return; }
  const d = Object.fromEntries(new FormData(f));
  const a = Store.add({ cat: d.cat, title: d.title.trim(), price: +d.price || 0, city: d.city.trim(), desc: d.desc.trim(),
    author: d.author.trim() || ME, photo: newPhoto, source: 'tg' });
  newPhoto = ''; haptic('medium');
  try { tg && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  toast('Отправлено на модерацию. Одобрить можно во вкладке «Модерация»');
  tab = 'my'; render();
}
function syncMainButton() {
  if (!inTG) return;
  const mb = tg.MainButton;
  if (tab === 'new' && !sheetOpen) { mb.setText('Опубликовать'); mb.show(); mb.offClick(submit); mb.onClick(submit); }
  else if (sheetOpen) { /* задаётся в openAd */ }
  else { mb.hide(); mb.offClick(submit); }
}

function openAd(id) {
  const a = Store.get(id); if (!a) return;
  Store.view(id); sheetOpen = true; haptic();
  $('#sheetBody').innerHTML = `<div class="hero" style="background:${Store.cover(a)}">${a.photo ? '' : Store.icon(a.cat)}</div>
    <div class="sec"><div class="big">${esc(Store.price(a))}</div><h1>${esc(a.title)}</h1>
      <div class="meta">${esc(a.city)} · ${Store.ago(a.createdAt)} · 👁 ${a.views} · ${esc(Store.catName(a.cat))}</div></div>
    <div class="sec"><b>Описание</b><p style="margin:6px 0 0;white-space:pre-wrap">${esc(a.desc || 'Без описания')}</p></div>
    <div class="sec row"><div class="ava">${esc((a.author || '?')[0])}</div><div><b>${esc(a.author)}</b>
      <div class="meta">Подано ${a.source === 'tg' ? 'через Telegram' : 'на сайте'}</div></div></div>
    <div class="sec" style="display:grid;gap:8px">
      <button class="btn" id="writeBtn">✉️ Написать продавцу</button>
      <button class="btn sec2" data-fav="${a.id}" id="favBig">${Store.isFav(a.id) ? '♥ В избранном' : '♡ В избранное'}</button></div>`;
  $('#sheet').classList.add('open');
  $('#writeBtn').onclick = write;
  if (inTG) {
    tg.BackButton.show(); tg.BackButton.onClick(closeAd);
    tg.MainButton.offClick(submit); tg.MainButton.setText('Написать продавцу'); tg.MainButton.show(); tg.MainButton.onClick(write);
  }
}
function write() { toast('В боевой версии откроется чат с продавцом в Telegram'); haptic(); }
function closeAd() {
  sheetOpen = false; $('#sheet').classList.remove('open');
  if (inTG) { tg.BackButton.hide(); tg.BackButton.offClick(closeAd); tg.MainButton.offClick(write); }
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-fav],[data-open],[data-cat],[data-tab],[data-ok],[data-no],[data-del],#resetBtn');
  if (!t) return;
  if (t.dataset.fav) { e.stopPropagation(); Store.toggleFav(t.dataset.fav); haptic();
    if (t.id === 'favBig') t.textContent = Store.isFav(t.dataset.fav) ? '♥ В избранном' : '♡ В избранное'; return; }
  if (t.dataset.open) return openAd(t.dataset.open);
  if (t.dataset.cat) { cat = t.dataset.cat; haptic(); return render(); }
  if (t.dataset.tab) { tab = t.dataset.tab; window.scrollTo(0, 0); haptic(); return render(); }
  if (t.dataset.ok) { Store.setStatus(t.dataset.ok, 'active'); toast('Опубликовано — уже видно на сайте'); return; }
  if (t.dataset.no) { Store.setStatus(t.dataset.no, 'rejected'); return; }
  if (t.dataset.del) { Store.remove(t.dataset.del); return; }
  if (t.id === 'resetBtn') { Store.reset(); toast('Демо-данные сброшены'); }
});
$('#q').addEventListener('input', e => { q = e.target.value; render(); $('#q').focus(); });
$('#backBtn').onclick = closeAd;

Store.subscribe((evt, local) => {
  if (!local && evt && evt.type === 'new') { freshId = evt.id; toast('🆕 Новое объявление с сайта'); }
  if (!local && evt && evt.type === 'status' && evt.status === 'active') { freshId = evt.id; toast('🆕 Объявление опубликовано'); }
  if (!sheetOpen && tab !== 'new') render();
  setTimeout(() => { freshId = null; }, 1700);
});
setInterval(() => { if (!sheetOpen && tab === 'feed') render(); }, 60000);
render();
</script>
</body>
</html>
